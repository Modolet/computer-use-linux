[package]
name = "computer-use-linux"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.6", features = ["derive"] }
fs2 = "0.4.3"
gbm = { version = "0.18.0", default-features = false }
gio-unix = "0.22.8"
gtk4 = { version = "0.11.4", features = ["v4_14", "v4_8"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
memmap2 = "0.9.11"
niri-ipc = "26.4.0"
nix = { version = "0.31.3", features = ["fs", "socket", "poll", "process", "signal", "user"] }
rmcp = { version = "3.2.0", features = ["server", "transport-io", "schemars"] }
schemars = { version = "1.2.2", features = ["uuid1"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = { version = "1.26.0", features = ["v4", "serde"] }
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client"] }
wayland-protocols-misc = { version = "0.3.12", features = ["client"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
